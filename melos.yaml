name: fuelrush

packages:
  - apps/mobile
  - packages/shared
  - packages/ui_flutter

command:
  bootstrap:
    runPubGetInParallel: true
    usePubspecOverrides: true

scripts:
  analyze:
    run: melos exec -- "dart analyze ."
    description: Run Dart analyzer across all packages

  format:
    run: melos exec -- "dart format ."
    description: Format all Dart files

  test:
    run: melos exec --dir-exists="test" -- "flutter test"
    description: Run all tests across packages

  generate:
    run: melos exec --depends-on="build_runner" -- "dart run build_runner build --delete-conflicting-outputs"
    description: Run code generation

  mobile:run:
    run: cd apps/mobile && flutter run --dart-define-from-file=dart_defines/dev.json
    description: Run FUELRUSH mobile app in dev mode